  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

919; /* near-black ink */\n  --set-slate:         #5f6a72; /* steel / slate gray */\n  --set-sage:          #6f8a6b; /* field sage green (secondary accent) */\n  --set-paper:         #f5f5f5; /* off-white paper */\n  --set-white:         #ffffff;\n\n  /* ---- Orange ramp ---- */\n  --orange-700:        #b8470f;\n  --orange-600:        #d4521a;\n  --orange-500:        #ec6424; /* base */\n  --orange-400:        #f2814b;\n  --orange-300:        #f7a87f;\n  --orange-100:        #fbe2d4;\n  --orange-50:         #fdf2ea;\n\n  /* ---- Ink / neutral ramp (warm-cool steel) ---- */\n  --ink-900:           #191919;\n  --ink-800:           #262829;\n  --ink-700:           #34383b;\n  --ink-600:           #454b4f;\n  --ink-500:           #5f6a72; /* slate */\n  --ink-400:           #818c93;\n  --ink-300:           #aab2b7;\n  --ink-200:           #d2d7da;\n  --ink-150:           #e2e5e7;\n  --ink-100:           #edeff0;\n  --ink-50:            #f5f5f5; /* paper */\n\n  /* ---- Sage ramp ---- */\n  --sage-600:          #56704f;\n  --sage-500:          #6f8a6b;\n  --sage-300:          #a6bba2;\n  --sage-100:          #dde6db;\n\n  /* ---- Semantic surface ---- */\n  --surface-page:      var(--ink-50);\n  --surface-card:      var(--set-white);\n  --surface-raised:    var(--set-white);\n  --surface-sunken:    var(--ink-100);\n  --surface-inverse:   var(--ink-900);\n  --surface-brand:     var(--set-orange);\n\n  /* ---- Semantic text ---- */\n  --text-strong:       var(--ink-900);\n  --text-body:         var(--ink-800);\n  --text-muted:        var(--ink-500);\n  --text-faint:        var(--ink-400);\n  --text-inverse:      var(--set-white);\n  --text-brand:        var(--orange-600);\n  --text-on-brand:     var(--set-white);\n\n  /* ---- Borders / lines ---- */\n  --border-hairline:   var(--ink-150);\n  --border-default:    var(--ink-200);\n  --border-strong:     var(--ink-400);\n  --border-brand:      var(--set-orange);\n\n  /* ---- Status ---- */\n  --status-success:    #3f8f4f;\n  --status-success-bg: #e7f2e8;\n  --status-warning:    var(--set-orange);\n  --status-warning-bg: var(--orange-50);\n  --status-danger:     #c0392b;\n  --status-danger-bg:  #fbeae8;\n  --status-info:       var(--ink-500);\n  --status-info-bg:    var(--ink-100);\n\n  /* ---- Focus ---- */\n  --focus-ring:        color-mix(in srgb, var(--set-orange) 55%, transparent);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   S.E.T. — TYPOGRAPHY TOKENS\n   Three-font system:\n   - Display / headers : Oswald            (primary title face)\n   - Accent / labels   : Saira Condensed   (subs Agency FB) — short text only\n   - Body              : Source Sans 3     (subs Source Sans Pro)\n   - Mono              : Source Code Pro   (spec values, job numbers, code)\n   ============================================================ */\n:root {\n  --font-display: 'Oswald', 'Arial Narrow', sans-serif;\n  --font-accent:  'Saira Condensed', 'Oswald', 'Arial Narrow', sans-serif;\n  --font-body:    'Source Sans 3', 'Source Sans Pro', system-ui, sans-serif;\n  --font-mono:    'Source Code Pro', ui-monospace, 'SFMono-Regular', monospace;\n\n  /* ---- Weights ---- */\n  --fw-regular: 400; /* @kind other */\n  --fw-medium:  500; /* @kind other */\n  --fw-semibold:600; /* @kind other */\n  --fw-bold:    700; /* @kind other */\n\n  /* ---- Type scale (px / rem-ish, fixed) ---- */\n  --fs-display-1: 64px;\n  --fs-display-2: 48px;\n  --fs-h1:        38px;\n  --fs-h2:        30px;\n  --fs-h3:        23px;\n  --fs-h4:        19px;\n  --fs-body-lg:   18px;\n  --fs-body:      16px;\n  --fs-body-sm:   14px;\n  --fs-caption:   13px;\n  --fs-label:     12px;\n\n  /* ---- Line heights ---- */\n  --lh-tight:   1.04; /* @kind other */\n  --lh-snug:    1.18; /* @kind other */\n  --lh-normal:  1.5; /* @kind other */\n  --lh-relaxed: 1.62; /* @kind other */\n\n  /* ---- Letter spacing ---- */\n  --ls-display: -0.01em; /* @kind other */\n  --ls-tight:   0; /* @kind other */\n  --ls-label:   0.12em; /* @kind other */\n  --ls-wide:    0.22em; /* @kind other */\n}\n\n/* ---- Type role helpers (optional shortcuts for consumers) ---- */\n.set-display-1 { font-family: var(--font-display); font-weight: var(--fw-bold);\n  font-size: var(--fs-display-1); line-height: var(--lh-tight); letter-spacing: var(--ls-display);\n  text-transform: uppercase; color: var(--text-strong); }\n.set-display-2 { font-family: var(--font-display); font-weight: var(--fw-bold);\n  font-size: var(--fs-display-2); line-height: var(--lh-tight); letter-spacing: var(--ls-display);\n  text-transform: uppercase; color: var(--text-strong); }\n.set-h1 { font-family: var(--font-display); font-weight: var(--fw-semibold);\n  font-size: var(--fs-h1); line-height: var(--lh-snug); text-transform: uppercase; color: var(--text-strong); }\n.set-h2 { font-family: var(--font-display); font-weight: var(--fw-semibold);\n  font-size: var(--fs-h2); line-height: var(--lh-snug); text-transform: uppercase; color: var(--text-strong); }\n.set-h3 { font-family: var(--font-display); font-weight: var(--fw-medium);\n  font-size: var(--fs-h3); line-height: var(--lh-snug); color: var(--text-strong); }\n.set-eyebrow { font-family: var(--font-accent); font-weight: var(--fw-semibold);\n  font-size: var(--fs-label); line-height: 1; letter-spacing: var(--ls-label);\n  text-transform: uppercase; color: var(--text-brand); }\n.set-body { font-family: var(--font-body); font-weight: var(--fw-regular);\n  font-size: var(--fs-body); line-height: var(--lh-relaxed); color: var(--text-body); }\n.set-mono { font-family: var(--font-mono); font-size: var(--fs-body-sm); letter-spacing: 0.01em; }\n<\u002Fstyle>\n  <style>/* ============================================================\n   S.E.T. — SPACING & LAYOUT TOKENS\n   4px base grid. Construction-document feel: generous, gridded.\n   ============================================================ */\n:root {\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* ---- Container widths ---- */\n  --container-narrow: 720px;\n  --container-text:   880px;\n  --container-base:   1140px;\n  --container-wide:   1320px;\n\n  /* ---- Section rhythm ---- */\n  --section-y:        var(--space-24);\n  --gutter:           var(--space-6);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   S.E.T. — EFFECTS: radius, borders, shadows, motion\n   Industrial / engineered: low radii, crisp hairlines, firm shadows.\n   ============================================================ */\n:root {\n  /* ---- Radius (kept tight — this brand is squared-off) ---- */\n  --radius-none: 0;\n  --radius-xs:   2px;\n  --radius-sm:   4px;\n  --radius-md:   6px;\n  --radius-lg:   10px;\n  --radius-pill: 999px;\n\n  /* ---- Border widths ---- */\n  --bw-hair:  1px;\n  --bw-base:  2px;\n  --bw-bold:  3px;   /* signature: bold left/bottom accent rules */\n\n  /* ---- Shadows — firm, low-spread, neutral (no colored glows) ---- */\n  --shadow-xs:  0 1px 2px rgba(25,25,25,0.06);\n  --shadow-sm:  0 1px 3px rgba(25,25,25,0.10), 0 1px 2px rgba(25,25,25,0.06);\n  --shadow-md:  0 4px 10px rgba(25,25,25,0.10), 0 2px 4px rgba(25,25,25,0.06);\n  --shadow-lg:  0 12px 28px rgba(25,25,25,0.14), 0 4px 8px rgba(25,25,25,0.07);\n  --shadow-inset: inset 0 1px 2px rgba(25,25,25,0.08);\n\n  /* ---- Signature accent rule (left bar / underline) ---- */\n  --accent-bar: var(--bw-bold) solid var(--set-orange); /* @kind other */\n\n  /* ---- Motion — purposeful, mechanical, no bounce ---- */\n  --ease-standard: cubic-bezier(0.2, 0, 0.1, 1); /* @kind other */\n  --ease-out:      cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast:   120ms; /* @kind other */\n  --dur-base:   180ms; /* @kind other */\n t-display: swap;\n  src: url(\"1e946f13-06ab-4e43-91ec-791ce62ca64f\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e3e85286-8626-461c-afa8-d14deabf15f1\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"da2c7b4c-ed64-47c7-82d0-f1da05abf47e\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d401902c-29f4-4560-9bc6-be28d817ae51\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d5d2af6c-3ca8-43a1-aa3c-94292413af6a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2089ce5c-1a74-4d0b-8bdc-aa7339695b37\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   S.E.T. — COLOR TOKENS\n   Source of truth: palette.ase\n   ============================================================ */\n:root {\n  /* ---- Brand palette (raw) ---- */\n  --set-orange:        #ec6424; /* primary brand — safety/highway orange */\n  --set-black:         #191919; /* near-black ink */\n  --set-slate:         #5f6a72; /* steel / slate gray */\n  --set-sage:          #6f8a6b; /* field sage green (secondary accent) */\n  --set-paper:         #f5f5f5; /* off-white paper */\n  --set-white:         #ffffff;\n\n  /* ---- Orange ramp ---- */\n  --orange-700:        #b8470f;\n  --orange-600:        #d4521a;\n  --orange-500:        #ec6424; /* base */\n  --orange-400:        #f2814b;\n  --orange-300:        #f7a87f;\n  --orange-100:        #fbe2d4;\n  --orange-50:         #fdf2ea;\n\n  /* ---- Ink / neutral ramp (warm-cool steel) ---- */\n  --ink-900:           #191919;\n  --ink-800:           #262829;\n  --ink-700:           #34383b;\n  --ink-600:           #454b4f;\n  --ink-500:           #5f6a72; /* slate */\n  --ink-400:           #818c93;\n  --ink-300:           #aab2b7;\n  --ink-200:           #d2d7da;\n  --ink-150:           #e2e5e7;\n  --ink-100:           #edeff0;\n  --ink-50:            #f5f5f5; /* paper */\n\n  /* ---- Sage ramp ---- */\n  --sage-600:          #56704f;\n  --sage-500:          #6f8a6b;\n  --sage-300:          #a6bba2;\n  --sage-100:          #dde6db;\n\n  /* ---- Semantic surface ---- */\n  --surface-page:      var(--ink-50);\n  --surface-card:      var(--set-white);\n  --surface-raised:    var(--set-white);\n  --surface-sunken:    var(--ink-100);\n  --surface-inverse:   var(--ink-900);\n  --surface-brand:     var(--set-orange);\n\n  /* ---- Semantic text ---- */\n  --text-strong:       var(--ink-900);\n  --text-body:         var(--ink-800);\n  --text-muted:        var(--ink-500);\n  --text-faint:        var(--ink-400);\n  --text-inverse:      var(--set-white);\n  --text-brand:        var(--orange-600);\n  --text-on-brand:     var(--set-white);\n\n  /* ---- Borders / lines ---- */\n  --border-hairline:   var(--ink-150);\n  --border-default:    var(--ink-200);\n  --border-strong:     var(--ink-400);\n  --border-brand:      var(--set-orange);\n\n  /* ---- Status ---- */\n  --status-success:    #3f8f4f;\n  --status-success-bg: #e7f2e8;\n  --status-warning:    var(--set-orange);\n  --status-warning-bg: var(--orange-50);\n  --status-danger:     #c0392b;\n  --status-danger-bg:  #fbeae8;\n  --status-info:       var(--ink-500);\n  --status-info-bg:    var(--ink-100);\n\n  /* ---- Focus ---- */\n  --focus-ring:        color-mix(in srgb, var(--set-orange) 55%, transparent);\n}\n\n/* ============================================================\n   S.E.T. — TYPOGRAPHY TOKENS\n   Three-font system:\n   - Display / headers : Oswald            (primary title face)\n   - Accent / labels   : Saira Condensed   (subs Agency FB) — short text only\n   - Body              : Source Sans 3     (subs Source Sans Pro)\n   - Mono              : Source Code Pro   (spec values, job numbers, code)\n   ============================================================ */\n:root {\n  --font-display: 'Oswald', 'Arial Narrow', sans-serif;\n  --font-accent:  'Saira Condensed', 'Oswald', 'Arial Narrow', sans-serif;\n  --font-body:    'Source Sans 3', 'Source Sans Pro', system-ui, sans-serif;\n  --font-mono:    'Source Code Pro', ui-monospace, 'SFMono-Regular', monospace;\n\n  /* ---- Weights ---- */\n  --fw-regular: 400; /* @kind other */\n  --fw-medium:  500; /* @kind other */\n  --fw-semibold:600; /* @kind other */\n  --fw-bold:    700; /* @kind other */\n\n  /* ---- Type scale (px / rem-ish, fixed) ---- */\n  --fs-display-1: 64px;\n  --fs-display-2: 48px;\n  --fs-h1:        38px;\n  --fs-h2:        30px;\n  --fs-h3:        23px;\n  --fs-h4:        19px;\n  --fs-body-lg:   18px;\n  --fs-body:      16px;\n  --fs-body-sm:   14px;\n  --fs-caption:   13px;\n  --fs-label:     12px;\n\n  /* ---- Line heights ---- */\n  --lh-tight:   1.04; /* @kind other */\n  --lh-snug:    1.18; /* @kind other */\n  --lh-normal:  1.5; /* @kind other */\n  --lh-relaxed: 1.62; /* @kind other */\n\n  /* ---- Letter spacing ---- */\n  --ls-display: -0.01em; /* @kind other */\n  --ls-tight:   0; /* @kind other */\n  --ls-label:   0.12em; /* @kind other */\n  --ls-wide:    0.22em; /* @kind other */\n}\n\n/* ---- Type role helpers (optional shortcuts for consumers) ---- */\n.set-display-1 { font-family: var(--font-display); font-weight: var(--fw-bold);\n  font-size: var(--fs-display-1); line-height: var(--lh-tight); letter-spacing: var(--ls-display);\n  text-transform: uppercase; color: var(--text-strong); }\n.set-display-2 { font-family: var(--font-display); font-weight: var(--fw-bold);\n  font-size: var(--fs-display-2); line-height: var(--lh-tight); letter-spacing: var(--ls-display);\n  text-transform: uppercase; color: var(--text-strong); }\n.set-h1 { font-family: var(--font-display); font-weight: var(--fw-semibold);\n  font-size: var(--fs-h1); line-height: var(--lh-snug); text-transform: uppercase; color: var(--text-strong); }\n.set-h2 { font-family: var(--font-display); font-weight: var(--fw-semibold);\n  font-size: var(--fs-h2); line-height: var(--lh-snug); text-transform: uppercase; color: var(--text-strong); }\n.set-h3 { font-family: var(--font-display); font-weight: var(--fw-medium);\n  font-size: var(--fs-h3); line-height: var(--lh-snug); color: var(--text-strong); }\n.set-eyebrow { font-family: var(--font-accent); font-weight: var(--fw-semibold);\n  font-size: var(--fs-label); line-height: 1; letter-spacing: var(--ls-label);\n  text-transform: uppercase; color: var(--text-brand); }\n.set-body { font-family: var(--font-body); font-weight: var(--fw-regular);\n  font-size: var(--fs-body); line-height: var(--lh-relaxed); color: var(--text-body); }\n.set-mono { font-family: var(--font-mono); font-size: var(--fs-body-sm); letter-spacing: 0.01em; }\n\n/* ============================================================\n   S.E.T. — SPACING & LAYOUT TOKENS\n   4px base grid. Construction-document feel: generous, gridded.\n   ============================================================ */\n:root {\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* ---- Container widths ---- */\n  --container-narrow: 720px;\n  --container-text:   880px;\n  --container-base:   1140px;\n  --container-wide:   1320px;\n\n  /* ---- Section rhythm ---- */\n  --section-y:        var(--space-24);\n  --gutter:           var(--space-6);\n}\n\n/* ============================================================\n   S.E.T. — EFFECTS: radius, borders, shadows, motion\n   Industrial / engineered: low radii, crisp hairlines, firm shadows.\n   ============================================================ */\n:root {\n  /* ---- Radius (kept tight — this brand is squared-off) ---- */\n  --radius-none: 0;\n  --radius-xs:   2px;\n  --radius-sm:   4px;\n  --radius-md:   6px;\n  --radius-lg:   10px;\n  --radius-pill: 999px;\n\n  /* ---- Border widths ---- */\n  --bw-hair:  1px;\n  --bw-base:  2px;\n  --bw-bold:  3px;   /* signature: bold left/bottom accent rules */\n\n  /* ---- Shadows — firm, low-spread, neutral (no colored glows) ---- */\n  --shadow-xs:  0 1px 2px rgba(25,25,25,0.06);\n  --shadow-sm:  0 1px 3px rgba(25,25,25,0.10), 0 1px 2px rgba(25,25,25,0.06);\n  --shadow-md:  0 4px 10px rgba(25,25,25,0.10), 0 2px 4px rgba(25,25,25,0.06);\n  --shadow-lg:  0 12px 28px rgba(25,25,25,0.14), 0 4px 8px rgba(25,25,25,0.07);\n  --shadow-inset: inset 0 1px 2px rgba(25,25,25,0.08);\n\n  /* ---- Signature accent rule (left bar / underline) ---- */\n  --accent-bar: var(--bw-bold) solid var(--set-orange); /* @kind other */\n\n  /* ---- Motion — purposeful, mechanical, no bounce ---- */\n  --ease-standard: cubic-bezier(0.2, 0, 0.1, 1); /* @kind other */\n  --ease-out:      cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast:   120ms; /* @kind other */\n  --dur-base:   180ms; /* @kind other */\n  --dur-slow:   280ms; /* @kind other */\n\n  /* ---- Hatch / texture overlay (engineering drawing feel) ---- */\n  --hatch: repeating-linear-gradient(45deg,\n            rgba(25,25,25,0.04) 0 2px, transparent 2px 7px); /* @kind other */\n}\n\n<\u002Fstyle>\n  <script src=\"c0684e71-a5c7-454b-aad4-63436cc58c75\"><\u002Fscript>\n  <style>\n    * { box-sizing: border-box; }\n    body { margin: 0; font-family: var(--font-body); }\n    a { color: var(--set-orange); text-decoration: none; }\n    a:hover { color: var(--set-orange-600, #d4551c); }\n    .sw-hamburger { display: none; }\n    @media (max-width: 860px) {\n      .sw-desktop-nav { display: none !important; }\n      .sw-hamburger { display: flex !important; }\n      .sw-grid2, .sw-grid2b, .sw-hero-split, .sw-contact-grid { grid-template-columns: 1fr !important; }\n      .sw-grid3, .sw-grid3b, .sw-grid4 { grid-template-columns: 1fr 1fr !important; }\n      .sw-hero-chevrons { display: none !important; }\n    }\n    @media (max-width: 560px) {\n      .sw-grid3, .sw-grid3b, .sw-grid4 { grid-template-columns: 1fr !important; }\n      .sw-footer-cols { flex-direction: column; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:var(--surface-page)\">\n\n  <header style=\"position:sticky;top:0;z-index:30;background:rgba(25,25,25,0.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--ink-700)\">\n    <div style=\"max-width:var(--container-wide);margin:0 auto;padding:0 var(--space-8);height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:20px;color:#fff;letter-spacing:0.02em\">S.E.T., Inc.<\u002Fa>\n      <nav class=\"sw-desktop-nav\" style=\"display:flex;align-item transform:uppercase;letter-spacing:0.12em;font-size:12px\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"margin-right:8px\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n                Project photo\n              <\u002Fdiv>\n              <div style=\"padding:var(--space-5)\">\n                <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Badge\" tone=\"neutral\" hint-size=\"auto,22px\">{{ p.cat }}<\u002Fx-import>\n                <h3 style=\"font-family:var(--font-display);text-transform:uppercase;font-weight:600;font-size:17px;margin:10px 0 0;color:var(--text-strong)\">{{ p.title }}<\u002Fh3>\n              <\u002Fdiv>\n            <\u002Fx-import>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:var(--space-10);text-align:center\">\n          <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Button\" variant=\"outline\" sc-camel-on-click=\"{{ goProjects }}\" hint-size=\"auto,44px\">View All Projects<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:var(--set-orange);color:#fff;padding:var(--space-16) var(--space-8)\">\n      <div style=\"max-width:var(--container-wide);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap\">\n        <div style=\"max-width:640px\">\n          <div style=\"font-family:var(--font-accent);font-weight:600;text-transform:uppercase;letter-spacing:0.18em;font-size:13px;opacity:0.85\">Contact Us Today<\u002Fdiv>\n          <h2 style=\"font-family:var(--font-display);text-transform:uppercase;font-weight:700;font-size:clamp(26px,3.2vw,40px);line-height:1.05;margin:12px 0 0\">Let's Talk About Your Project.<\u002Fh2>\n          <p style=\"margin-top:10px;font-size:16px;opacity:0.9\">Got a project in mind? Call 330.536.6724 or send us a note — we'll get back to you.<\u002Fp>\n        <\u002Fdiv>\n        <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Button\" variant=\"outline\" size=\"lg\" sc-camel-on-click=\"{{ goContact }}\" style=\"color:#fff;border-color:#fff\" hint-size=\"auto,52px\">Contact Us<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <section style=\"background:var(--ink-900);color:#fff;padding:var(--space-24) var(--space-8);position:relative;overflow:hidden\">\n      <div style=\"position:absolute;inset:0;background-image:var(--hatch);opacity:0.5\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:var(--container-wide);margin:0 auto\">\n        <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Eyebrow\" tone=\"light\" hint-size=\"auto,20px\">Since 1988<\u002Fx-import>\n        <h1 style=\"font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(36px,5vw,56px);margin:16px 0 0\">About S.E.T., Inc.<\u002Fh1>\n        <p style=\"font-size:18px;color:var(--ink-300);max-width:640px;margin-top:14px\">Family owned and operated general contracting and excavating, serving Ohio, Pennsylvania, and West Virginia.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:var(--surface-page);padding:var(--section-y) var(--space-8)\">\n      <div style=\"max-width:var(--container-base);margin:0 auto\">\n        <x-import component-from-global-scope=\"SETDesignSystem_43d10a.SectionHeader\" eyebrow=\"Our Story\" title=\"25+ Years in the Field\" hint-size=\"100%,auto\"><\u002Fx-import>\n        <p style=\"font-size:16px;line-height:1.7;color:var(--text-muted);margin-top:16px\">S.E.T. got its start in 1988 in Lowellville, Ohio, taking on general contracting work most crews wouldn't touch. That's still who we are: over $100 million in government and private contracts completed, and a team that's grown right alongside the size and complexity of the jobs. Bigger scope, same standard — do it safely, do it right, get it done on time.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:var(--surface-card);padding:var(--section-y) var(--space-8)\">\n      <div style=\"max-width:var(--container-base);margin:0 auto\">\n        <x-import component-from-global-scope=\"SETDesignSystem_43d10a.SectionHeader\" eyebrow=\"Safety Commitment\" title=\"Zero Incidents\" hint-size=\"100%,auto\"><\u002Fx-import>\n        <p style=\"font-size:16px;line-height:1.7;color:var(--text-muted);margin-top:16px\">Nobody goes home hurt — that's the standard, not a slogan. Every crew trains on the equipment and process for the job ahead, plans before moving, and has the authority to stop work the moment something looks off. We take that seriously enough to track it every year, because zero incidents is the only number that counts.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:var(--ink-900);color:#fff;padding:var(--section-y) var(--space-8)\">\n      <div style=\"max-width:var(--container-wide);margin:0 auto\">\n        <x-import component-from-global-scope=\"SETDesignSystem_43d10a.SectionHeader\" tone=\"light\" eyebrow=\"How We Operate\" title=\"The S.E.T. Code\" hint-size=\"100%,auto\"><\u002Fx-import>\n        <div style=\"display:flex;flex-direction:column;gap:2px;margin-top:var(--space-10)\">\n          <sc-for list=\"{{ operatingPrinciples }}\" as=\"v\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;gap:18px;padding:16px 0;border-bottom:1px solid var(--ink-700)\">\n              <div style=\"font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--set-orange);min-width:40px\">{{ v.n }}<\u002Fdiv>\n              <div>\n                <div style=\"font-family:var(--font-display);text-transform:uppercase;font-weight:600;font-size:17px\">{{ v.t }}<\u002Fdiv>\n                <div style=\"font-size:15px;color:var(--ink-300);margin-top:2px\">{{ v.d }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-family:var(--font-display);text-transform:uppercase;font-weight:700;font-size:22px;color:var(--set-orange);margin-top:var(--space-12)\">Let's get after it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isServices }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <section style=\"background:var(--ink-900);color:#fff;padding:var(--space-24) var(--space-8);position:relative;overflow:hidden\">\n      <div style=\"position:absolute;inset:0;background-image:var(--hatch);opacity:0.5\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:var(--container-wide);margin:0 auto\">\n        <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Eyebrow\" tone=\"light\" hint-size=\"auto,20px\">What We Do<\u002Fx-import>\n        <h1 style=\"font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(36px,5vw,56px);margin:16px 0 0\">Contracting Capabilities<\u002Fh1>\n        <p style=\"font-size:18px;color:var(--ink-300);max-width:640px;margin-top:14px\">The work we do, and the standard we hold it to.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:var(--surface-page);padding:var(--section-y) var(--space-8)\">\n      <div style=\"max-width:var(--container-wide);margin:0 auto\">\n        <x-import component-from-global-scope=\"SETDesignSystem_43d10a.SectionHeader\" eyebrow=\"Public &amp; Private Work\" title=\"General Contracting\" lead=\"We general contract for government agencies, municipalities, private developers, and utility companies across Ohio, Pennsylvania, and West Virginia — including work for ODOT and PennDOT. Same approach on every job: do it right, on schedule, no cut corners.\" hint-size=\"100%,auto\"><\u002Fx-import>\n        <div class=\"sw-grid3b\" style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 32px;margin-top:var(--space-10)\">\n          <sc-for list=\"{{ generalServices }}\" as=\"s\" hint-placeholder-count=\"12\">\n            <div style=\"display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border-default)\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--set-orange)\" stroke-width=\"2.5\" style=\"flex-shrink:0;margin-top:3px\"><path d=\"M4 12l5 5L20 6\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:14px;color:var(--text-body)\">{{ s }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:var(--set-orange);color:#fff;padding:var(--space-14) var(--space-8);text-align:center\">\n      <p style=\"font-size:17px;margin:0 0 16px\">Have a project coming up? Let's talk about it.<\u002Fp>\n      <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Button\" variant=\"outline\" size=\"lg\" sc-camel-on-click=\"{{ goContact }}\" style=\"color:#fff;border-color:#fff\" hint-size=\"auto,52px\">Contact Us<\u002Fx-import>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isProjects }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <section style=\"background:var(--ink-900);color:#fff;padding:var(--space-24) var(--space-8);position:relative;overflow:hidden\">\n      <div style=\"position:absolute;inset:0;background-image:var(--hatch);opacity:0.5\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:var(--container-wide);margin:0 auto\">\n        <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Eyebrow\" tone=\"light\" hint-size=\"auto,20px\">Selected Work<\u002Fx-import>\n        <h1 style=\"font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(36px,5vw,56px);margin:16px 0 0\">Our Work<\u002Fh1>\n        <p style=\"font-size:18px;color:var(--ink-300);max-width:640px;margin-top:14px\">A sample of the underground utility, roadway, and storm-water projects we've completed.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:var(--surface-page);padding:var(--section-y) var(--space-8)\">\n      <div style=\"max-width:var(--container-wide);margin:0 auto\">\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--space-10)\">\n          <sc-for list=\"{{ catButtons }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}font-family:var(--font-accent);font-weight:600;text-transform:uppercase;letter-spacing:0.08em;font-size:13px;padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer\">{{ c.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"sw-grid3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-6)\">\n          <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"10\">\n            <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Card\" data-padded=\"false\" hint-size=\"100%,220px\" style=\"overflow:hidden\">\n              <div style=\"aspect-ratio:16/10;background:var(--ink-150);background-image:var(--hatch);display:flex;align-items:center;justify-content:center;color:var(--ink-400);font-family:var(--font-accent);text-transform:uppercase;letter-spacing:0.12em;font-size:12px\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"margin-right:8px\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n                Project photo\n              <\u002Fdiv>\n              <div style=\"padding:var(--space-5)\">\n                <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Badge\" tone=\"neutral\" hint-size=\"auto,22px\">{{ p.cat }}<\u002Fx-import>\n                <h3 style=\"font-family:var(--font-display);text-transform:uppercase;font-weight:600;font-size:17px;margin:10px 0 0;color:var(--text-strong)\">{{ p.title }}<\u002Fh3>\n              <\u002Fdiv>\n            <\u002Fx-import>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCareers }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <section style=\"background:var(--ink-900);color:#fff;padding:var(--space-24) var(--space-8);position:relative;overflow:hidden\">\n      <div style=\"position:absolute;inset:0;background-image:var(--hatch);opacity:0.5\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:var(--container-wide);margin:0 auto\">\n        <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Eyebrow\" tone=\"light\" hint-size=\"auto,20px\">Join The Team<\u002Fx-import>\n        <h1 style=\"font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(36px,5vw,56px);margin:16px 0 0\">Careers<\u002Fh1>\n        <p style=\"font-size:18px;color:var(--ink-300);max-width:640px;margin-top:14px\">A long-term place to build a career — for union and non-union employees alike who take pride in their work.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:var(--surface-page);padding:var(--section-y) var(--space-8)\">\n      <div style=\"max-width:var(--container-base);margin:0 auto\">\n        <x-import component-from-global-scope=\"SETDesignSystem_43d10a.SectionHeader\" eyebrow=\"Why S.E.T.\" title=\"What It's Like to Work Here\" hint-size=\"100%,auto\"><\u002Fx-import>\n        <div style=\"display:flex;flex-direction:column;gap:2px;margin-top:var(--space-10)\">\n          <sc-for list=\"{{ careerQuotes }}\" as=\"q\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--border-default)\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--set-orange)\" stroke-width=\"2.5\" style=\"flex-shrink:0;margin-top:2px\"><path d=\"M4 12l5 5L20 6\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:16px;line-height:1.55;color:var(--text-body)\">{{ q }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:var(--surface-card);padding:var(--section-y) var(--space-8)\">\n      <div style=\"max-width:var(--container-base);margin:0 auto\">\n        <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Callout\" tone=\"brand\" title=\"Equal Opportunity Employer\" hint-size=\"100%,auto\">S.E.T. is an Equal Employment Opportunity and Affirmative Action employer. We don't discriminate on the basis of race, religion, color, national origin, gender, sexual orientation, gender identity, gender expression, age, protected veteran status, disability, or any other legally protected characteristic — and we strongly encourage females and minorities to apply.<\u002Fx-import>\n        <div style=\"margin-top:var(--space-10);text-align:center\">\n          <p style=\"font-size:16px;color:var(--text-muted);margin-bottom:16px\">We hire for both union and non-union positions. To hear about open positions, contact us at hr@setinc.biz or call 330.536.6724.<\u002Fp>\n          <div style=\"display:flex;gap:14px;justify-content:center;flex-wrap:wrap\">\n            <a href=\"https://set-inc.atsmodule.com/\" target=\"_blank\" rel=\"noopener\">\n              <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Button\" variant=\"primary\" size=\"lg\" hint-size=\"auto,52px\">View Open Positions<\u002Fx-import>\n            <\u002Fa>\n            <a href=\"mailto:hr@setinc.biz\">\n              <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Button\" variant=\"outline\" size=\"lg\" hint-size=\"auto,52px\">Email HR<\u002Fx-import>\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <section style=\"background:var(--ink-900);color:#fff;padding:var(--space-24) var(--space-8);position:relative;overflow:hidden\">\n      <div style=\"position:absolute;inset:0;background-image:var(--hatch);opacity:0.5\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:var(--container-wide);margin:0 auto\">\n        <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Eyebrow\" tone=\"light\" hint-size=\"auto,20px\">Get In Touch<\u002Fx-import>\n        <h1 style=\"font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(36px,5vw,56px);margin:16px 0 0\">Contact Us<\u002Fh1>\n        <p style=\"font-size:18px;color:var(--ink-300);max-width:640px;margin-top:14px\">Reach out by phone, email, or the form below.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:var(--surface-page);padding:var(--section-y) var(--space-8)\">\n      <div class=\"sw-contact-grid\" style=\"max-width:var(--container-base);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:var(--space-16)\">\n        <div>\n          <x-import component-from-global-scope=\"SETDesignSystem_43d10a.SectionHeader\" eyebrow=\"S.E.T., Inc.\" title=\"Visit or Reach Us\" hint-size=\"100%,auto\"><\u002Fx-import>\n          <div style=\"margin-top:24px;display:flex;flex-direction:column;gap:14px;font-size:15px;color:var(--text-body)\">\n            <div>235 East Water Street<br>Lowellville, OH 44436<\u002Fdiv>\n            <div><strong>Phone:<\u002Fstrong> <a href=\"tel:3305366724\">330.536.6724<\u002Fa><\u002Fdiv>\n            <div><strong>Fax:<\u002Fstrong> 330.536.8274<\u002Fdiv>\n            <div><strong>Email:<\u002Fstrong> <a href=\"mailto:general@setinc.biz\">general@setinc.biz<\u002Fa><\u002Fdiv>\n            <div><strong>Hours:<\u002Fstrong> 7:00 am – 5:00 pm, M-F<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:24px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)\">\n            <iframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3009.534687755791!2d-80.5365506841901!3d41.03543497929808!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8833f219977a6d19%3A0x2bcc297ceb733dd6!2sSet+Inc!5e0!3m2!1sen!2sus!4v1499263286328\" width=\"100%\" height=\"260\" style=\"border:0;display:block\" loading=\"lazy\"><\u002Fiframe>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Card\" data-accent=\"true\" hint-size=\"100%,480px\" style=\"padding:var(--space-8)\">\n          <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"text-align:center;padding:40px 10px\">\n              <div style=\"width:56px;height:56px;border-radius:50%;background:var(--status-success-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 16px\">\n                <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--status-success)\" stroke-width=\"2.5\"><path d=\"M4 12l5 5L20 6\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <h3 style=\"font-family:var(--font-display);text-transform:uppercase;font-size:22px;margin:0\">Message Received<\u002Fh3>\n              <p style=\"color:var(--text-muted);margin-top:8px\">We'll be in touch shortly. Thanks for reaching out.<\u002Fp>\n              <div style=\"margin-top:18px\">\n                <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Button\" variant=\"outline\" sc-camel-on-click=\"{{ resetForm }}\" hint-size=\"auto,40px\">Send another<\u002Fx-import>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ !sent }}\" hint-placeholder-val=\"{{ true }}\">\n            <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:flex;flex-direction:column;gap:16px\">\n              <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Input\" label=\"Full Name\" placeholder=\"Your name\" required=\"true\" hint-size=\"100%,64px\"><\u002Fx-import>\n              <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Input\" label=\"Phone Number\" placeholder=\"(330) 000-0000\" required=\"true\" hint-size=\"100%,64px\"><\u002Fx-import>\n              <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Input\" label=\"Email Address\" type=\"email\" placeholder=\"you@company.com\" required=\"true\" hint-size=\"100%,64px\"><\u002Fx-import>\n              <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Input\" label=\"Comments\" placeholder=\"Your comments\" hint-size=\"100%,64px\"><\u002Fx-import>\n              <x-import component-from-global-scope=\"SETDesignSystem_43d10a.Button\" variant=\"primary\" size=\"lg\" type=\"submit\" data-block=\"true\" hint-size=\"100%,52px\">Submit<\u002Fx-import>\n            <\u002Fform>\n          <\u002Fsc-if>\n        <\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"background:var(--ink-900);color:var(--ink-300);padding:var(--space-16) var(--space-8) var(--space-10)\">\n    <div style=\"max-width:var(--container-wide);margin:0 auto\">\n      <div class=\"sw-footer-cols\" style=\"display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap;border-bottom:1px solid var(--ink-700);padding-bottom:var(--space-10)\">\n        <div style=\"max-width:340px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:19px;color:#fff\">S.E.T., Inc.<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.6;margin-top:16px\">General contracting and excavating, family owned and operated since 1988. Serving Ohio, Pennsylvania, and West Virginia.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-16);flex-wrap:wrap\">\n          <div>\n            <div style=\"font-family:var(--font-accent);font-weight:600;text-transform:uppercase;letter-spacing:0.12em;font-size:12px;color:#fff;margin-bottom:14px\">Company<\u002Fdiv>\n            <div style=\"font-size:14px;margin-bottom:8px\"><a href=\"#\" sc-camel-on-click=\"{{ goAbout }}\" style=\"color:var(--ink-300)\">About Us<\u002Fa><\u002Fdiv>\n            <div style=\"font-size:14px;margin-bottom:8px\"><a href=\"#\" sc-camel-on-click=\"{{ goServices }}\" style=\"color:var(--ink-300)\">Capabilities<\u002Fa><\u002Fdiv>\n            <div style=\"font-size:14px;margin-bottom:8px\"><a href=\"#\" sc-camel-on-click=\"{{ goCareers }}\" style=\"color:var(--ink-300)\">Careers<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:var(--font-accent);font-weight:600;text-transform:uppercase;letter-spacing:0.12em;font-size:12px;color:#fff;margin-bottom:14px\">Work<\u002Fdiv>\n            <div style=\"font-size:14px;margin-bottom:8px\"><a href=\"#\" sc-camel-on-click=\"{{ goProjects }}\" style=\"color:var(--ink-300)\">Our Work<\u002Fa><\u002Fdiv>\n            <div style=\"font-size:14px;margin-bottom:8px\"><a href=\"mailto:bidding@setinc.biz\" style=\"color:var(--ink-300)\">Request a Bid<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:var(--font-accent);font-weight:600;text-transform:uppercase;letter-spacing:0.12em;font-size:12px;color:#fff;margin-bottom:14px\">Contact<\u002Fdiv>\n            <div style=\"font-size:14px;margin-bottom:8px\">235 East Water Street, Lowellville, OH 44436<\u002Fdiv>\n            <div s  negotiable — that's how we've kept clients since 1988.\",\n      \"We're dependable. If we say we'll have it done, we will — and we'll speak up early if something changes.\",\n      \"We show up ready. Planning and safety aren't extra steps here, they're how the job actually gets done.\",\n    ];\n\n    const capabilities = [\n      'Underground Utilities', 'Roadway / Highway Work', 'Sitework', 'Snow & Ice Removal',\n      'Streetscapes', 'Buildings', 'Culvert Repair & Replacement', 'Design Build Services',\n    ];\n\n    const generalServices = [\n      'Earthwork', 'Underground utilities', 'Roadway / Heavy Highway Construction',\n      'Streetscapes & downtown revitalizations', 'Culvert repair & replacement',\n      'Pump stations and booster stations', 'Site development', 'HDD and conventional pipe boring',\n      'Street lighting', 'Traffic signalization and ITS', 'Industrial and mill maintenance',\n      'Design build services',\n    ];\n\n    const allProjects = [\n      { title: 'Hartville Waste Water Treatment Plant', cat: 'Utilities' },\n      { title: 'Hankins Road NE Improvement', cat: 'Roadway' },\n      { title: 'Storm Drain Improvements', cat: 'Storm & Drainage' },\n      { title: 'Mentor Park Boulevard Waterline Replacement', cat: 'Utilities' },\n      { title: 'SR 50 Roadway Improvements Project', cat: 'Roadway' },\n      { title: 'Campbell Industrial Park Storm Improvements', cat: 'Storm & Drainage' },\n      { title: 'Kirtland Road Sanitary Sewer', cat: 'Utilities' },\n      { title: 'LTV South Side Works South Water Street Extension', cat: 'Roadway' },\n      { title: 'Greenville Water Systems Improvement', cat: 'Utilities' },\n      { title: 'North Sycamore Street Culvert Improvements', cat: 'Culvert' },\n    ];\n    const featuredProjects = allProjects.slice(0, 6);\n\n    const cats = ['All', 'Utilities', 'Roadway', 'Storm & Drainage', 'Culvert'];\n    const filter = this.state.projectFilter;\n    const catButtons = cats.map((c) => ({\n      name: c,\n      onClick: () => this.setState({ projectFilter: c }),\n      style: `border:1px solid ${c === filter ? ORANGE : 'var(--border-default)'};background:${c === filter ? ORANGE : 'transparent'};color:${c === filter ? '#fff' : 'var(--text-muted)'};`,\n    }));\n    const projects = filter === 'All' ? allProjects : allProjects.filter((p) => p.cat === filter);\n\n    const operatingPrinciples = [\n      { n: '01', t: 'Do the Work Right', d: \"Quality and accuracy matter. We don't cut corners.\" },\n      { n: '02', t: 'Be Dependable', d: 'Follow through on commitments.' },\n      { n: '03', t: 'Communicate Early and Clearly', d: 'Speak up before problems grow.' },\n      { n: '04', t: 'Use Trust Responsibly', d: 'Flexibility works when everyone acts professionally.' },\n      { n: '05', t: 'Respect the Work and the People', d: 'Fair treatment and professionalism are the standard.' },\n    ];\n\n    const careerQuotes = [\n      'We take the work seriously. We care about quality, accuracy, and follow-through.',\n      \"If you say you'll do something, do it — and speak up early if something's off.\",\n      'We offer fair PTO and flex days, and we trust people to use them right.',\n      \"If you're sick, stay home. No penalties, no guilt. Get better and come back ready.\",\n      \"This is a long-term place. If you take pride in your work, you'll do well here.\",\n    ];\n\n    const homeLayout = this.props.homeLayout ?? 'classic';\n\n    return {\n      isHome: page === 'home', isAbout: page === 'about', isServices: page === 'services',\n      isProjects: page === 'projects', isCareers: page === 'careers', isContact: page === 'contact',\n      isLayoutClassic: homeLayout === 'classic', isLayoutSplit: homeLayout === 'split', isLayoutBanner: homeLayout === 'banner',\n      goHome: this.go('home'), goAbout: this.go('about'), goServices: this.go('services'),\n      goProjects: this.go('projects'), goCareers: this.go('careers'), goContact: this.go('contact'),\n
